name: CI/CD - My Songs

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Guard against accidental secret commits
        run: |
          if git grep -nIE "AIza[0-9A-Za-z_-]{35}|pk_live_[0-9A-Za-z]+" -- ':!package-lock.json' ':!workers/package-lock.json'; then
            echo "::error::A real Firebase API key or Yoco live key was found in tracked files. Remove it before committing."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create environment files
        run: |
          # Copy the committed placeholder template to the gitignored base file so the
          # app's `import ... from '../environments/environment'` resolves in CI. The
          # `qa` build configuration then file-replaces it with environment.qa.ts.
          cp src/environments/environment.example.ts src/environments/environment.ts
          cat > src/environments/environment.qa.ts << 'EOF'
          export const environment = {
            production: false,
            firebase: {
              projectId: '${{ secrets.FIREBASE_QA_PROJECT_ID }}',
              appId: '${{ secrets.FIREBASE_QA_APP_ID }}',
              apiKey: '${{ secrets.FIREBASE_QA_API_KEY }}',
              authDomain: '${{ secrets.FIREBASE_QA_AUTH_DOMAIN }}',
              storageBucket: '${{ secrets.FIREBASE_QA_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.FIREBASE_QA_MESSAGING_SENDER_ID }}',
            },
            yoco: {
              publicKey: '${{ secrets.YOCO_QA_PUBLIC_KEY }}',
            },
            api: {
              workerUrl: '${{ secrets.FIREBASE_QA_WORKER_URL }}',
            },
          };
          EOF
          # Fail fast if any required QA secret is missing or empty.
          if grep -qE "projectId: ''|appId: ''|apiKey: ''|authDomain: ''|storageBucket: ''|messagingSenderId: ''|publicKey: ''|workerUrl: ''" src/environments/environment.qa.ts; then
            echo "::error::One or more QA secrets are empty. Add FIREBASE_QA_*, YOCO_QA_PUBLIC_KEY and FIREBASE_QA_WORKER_URL under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build QA version
        run: npm run build:qa

      - name: Run tests
        run: npm run test:ci

  deploy-qa:
    name: Deploy to QA
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/qa'
    environment: qa
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-qa
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create environment files
        run: |
          # Copy the committed placeholder template to the gitignored base file so the
          # app's `import ... from '../environments/environment'` resolves in CI. The
          # `qa` build configuration then file-replaces it with environment.qa.ts.
          cp src/environments/environment.example.ts src/environments/environment.ts
          cat > src/environments/environment.qa.ts << 'EOF'
          export const environment = {
            production: false,
            firebase: {
              projectId: '${{ secrets.FIREBASE_QA_PROJECT_ID }}',
              appId: '${{ secrets.FIREBASE_QA_APP_ID }}',
              apiKey: '${{ secrets.FIREBASE_QA_API_KEY }}',
              authDomain: '${{ secrets.FIREBASE_QA_AUTH_DOMAIN }}',
              storageBucket: '${{ secrets.FIREBASE_QA_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.FIREBASE_QA_MESSAGING_SENDER_ID }}',
            },
            yoco: {
              publicKey: '${{ secrets.YOCO_QA_PUBLIC_KEY }}',
            },
            api: {
              workerUrl: '${{ secrets.FIREBASE_QA_WORKER_URL }}',
            },
          };
          EOF
          # Fail fast if any required QA secret is missing or empty.
          if grep -qE "projectId: ''|appId: ''|apiKey: ''|authDomain: ''|storageBucket: ''|messagingSenderId: ''|publicKey: ''|workerUrl: ''" src/environments/environment.qa.ts; then
            echo "::error::One or more QA secrets are empty. Add FIREBASE_QA_*, YOCO_QA_PUBLIC_KEY and FIREBASE_QA_WORKER_URL under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build QA version
        run: npm run build:qa

      - name: Deploy to Firebase QA Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes firebase-tools deploy --only hosting --project ${{ secrets.FIREBASE_QA_PROJECT_ID }} --token "$FIREBASE_TOKEN" --non-interactive

  deploy-prod:
    name: Deploy to Production
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Production environment files
        run: |
          # Copy the committed placeholder template to the gitignored base file so the
          # app's `import ... from '../environments/environment'` resolves in CI. The
          # `production` build configuration then file-replaces it with environment.prod.ts.
          cp src/environments/environment.example.ts src/environments/environment.ts
          cat > src/environments/environment.prod.ts << 'EOF'
          export const environment = {
            production: true,
            firebase: {
              projectId: '${{ secrets.FIREBASE_PROD_PROJECT_ID }}',
              appId: '${{ secrets.FIREBASE_PROD_APP_ID }}',
              apiKey: '${{ secrets.FIREBASE_PROD_API_KEY }}',
              authDomain: '${{ secrets.FIREBASE_PROD_AUTH_DOMAIN }}',
              storageBucket: '${{ secrets.FIREBASE_PROD_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.FIREBASE_PROD_MESSAGING_SENDER_ID }}',
            },
            yoco: {
              publicKey: '${{ secrets.YOCO_PROD_PUBLIC_KEY }}',
            },
            api: {
              workerUrl: '${{ secrets.FIREBASE_PROD_WORKER_URL }}',
            },
          };
          EOF
          # Fail fast if any required production secret is missing or empty.
          if grep -qE "projectId: ''|appId: ''|apiKey: ''|authDomain: ''|storageBucket: ''|messagingSenderId: ''|publicKey: ''|workerUrl: ''" src/environments/environment.prod.ts; then
            echo "::error::One or more production secrets are empty. Add FIREBASE_PROD_*, YOCO_PROD_PUBLIC_KEY and FIREBASE_PROD_WORKER_URL under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build production version
        run: npm run build

      - name: Deploy to Firebase Production Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes firebase-tools deploy --only hosting --project ${{ secrets.FIREBASE_PROD_PROJECT_ID }} --token "$FIREBASE_TOKEN" --non-interactive
