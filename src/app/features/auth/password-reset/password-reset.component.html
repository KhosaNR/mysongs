<div class="reset-page">
  <div class="reset-card">
    <h1 class="reset-title">Reset Password</h1>
    <p class="reset-subtitle">Enter your email and we'll send you a reset link</p>

    @if (error()) {
      <app-error-banner [message]="error()!" (dismiss)="clearError()" />
    }

    @if (emailSent()) {
      <div class="reset-success">
        <p>
          Check your inbox! If an account exists with that email, you'll receive a password reset
          link shortly.
        </p>
        <a routerLink="/auth/login" class="link">Back to sign in</a>
      </div>
    } @else {
      <form [formRoot]="resetForm" (submit)="onSubmit()" class="reset-form">
        <div class="form-field">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            [formField]="resetForm.email"
            class="form-field__control"
            placeholder="you@example.com"
          />
          <app-field-errors [field]="resetForm.email" />
        </div>

        <button type="submit" class="btn btn--primary btn--block" [disabled]="isLoading()">
          @if (isLoading()) {
            <app-loading-spinner size="sm" />
            <span>Sending...</span>
          } @else {
            <span>Send Reset Link</span>
          }
        </button>
      </form>

      <p class="reset-footer">
        <a routerLink="/auth/login" class="link">Back to sign in</a>
      </p>
    }
  </div>
</div>
