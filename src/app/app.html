<!-- App Shell Layout -->
<div class="app-shell">
  <div class="app-shell__layout">
    <!-- System-wide left sidebar -->
    <app-site-sidebar [isOpen]="isSidebarOpen()" (closeRequested)="closeSidebar()" />

    <div class="app-shell__content" [class.app-shell__content--sidebar-open]="isSidebarOpen()">
      <!-- Global Site Header -->
      <app-site-header (menuToggle)="toggleSidebar()" [isSidebarOpen]="isSidebarOpen()" />

      <!-- Main Content Area -->
      <main class="app-main" [class.app-main--no-player]="!hasActivePlayer()">
        <router-outlet />
      </main>
    </div>
  </div>

  <!-- Global Persistent Audio Player -->
  <app-audio-player />
</div>

<!-- Global Components -->
<app-network-status />
<app-cookie-consent />
